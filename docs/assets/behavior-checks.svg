<svg viewBox="0 0 1760 680" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, 'Avenir Next', 'Nunito Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- behavior-judge palette: cream #F7F4EC · slate #35414B · sage #7E9C6F · taupe #CBC1AD · clay #B65C48 -->
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,0.8 L9.2,5 L0.5,9.2 Z" fill="#46525C"/>
    </marker>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#3A4650" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1760" height="680" fill="#F7F4EC"/>

  <!-- Header -->
  <text x="880" y="105" text-anchor="middle" font-size="28" font-weight="600" letter-spacing="4" fill="#35414B">SOME COMMON AGENT BEHAVIOR CHECKS</text>

  <!-- ============ Card 1 · Ordering ============ -->
  <rect x="90" y="170" width="460" height="420" rx="24" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft3)"/>
  <!-- pill -->
  <rect x="243" y="208" width="154" height="36" rx="18" fill="#F1EDE2" stroke="#E2DACA" stroke-width="1"/>
  <circle cx="269" cy="226" r="5" fill="#7E9C6F"/>
  <text x="330" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#35414B">Ordering</text>
  <!-- X chip -->
  <rect x="265" y="286" width="110" height="54" rx="14" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="1.8"/>
  <text x="320" y="321" text-anchor="middle" font-size="23" font-weight="600" fill="#46603C">X</text>
  <!-- must come before pill -->
  <line x1="320" y1="346" x2="320" y2="370" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow3)"/>
  <rect x="216" y="380" width="208" height="34" rx="17" fill="#EFE7D6" stroke="#E2D8C2" stroke-width="1"/>
  <text x="320" y="403" text-anchor="middle" font-size="15" font-weight="600" fill="#77694F">must come before</text>
  <!-- Y chip -->
  <line x1="320" y1="420" x2="320" y2="444" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow3)"/>
  <rect x="265" y="454" width="110" height="54" rx="14" fill="#FFFFFF" stroke="#B9C0C7" stroke-width="1.8"/>
  <text x="320" y="489" text-anchor="middle" font-size="23" font-weight="600" fill="#35414B">Y</text>
  <!-- caption -->
  <text x="320" y="558" text-anchor="middle" font-size="16" font-style="italic" fill="#7A848C">The agent does X before Y</text>

  <!-- ============ Card 2 · Forbidden ============ -->
  <rect x="650" y="170" width="460" height="420" rx="24" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft3)"/>
  <!-- pill -->
  <rect x="801" y="208" width="158" height="36" rx="18" fill="#F1EDE2" stroke="#E2DACA" stroke-width="1"/>
  <circle cx="827" cy="226" r="5" fill="#B65C48"/>
  <text x="889" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#35414B">Forbidden</text>
  <!-- X chip with prohibition ring -->
  <rect x="825" y="368" width="110" height="54" rx="14" fill="#FFFFFF" stroke="#B9C0C7" stroke-width="1.8"/>
  <circle cx="880" cy="395" r="88" fill="none" stroke="#B65C48" stroke-width="6"/>
  <line x1="818" y1="333" x2="942" y2="457" stroke="#B65C48" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <text x="880" y="403" text-anchor="middle" font-size="23" font-weight="600" fill="#35414B">X</text>
  <!-- caption -->
  <text x="880" y="558" text-anchor="middle" font-size="16" font-style="italic" fill="#7A848C">The agent never does X</text>

  <!-- ============ Card 3 · Count ============ -->
  <rect x="1210" y="170" width="460" height="420" rx="24" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft3)"/>
  <!-- pill -->
  <rect x="1379" y="208" width="122" height="36" rx="18" fill="#F1EDE2" stroke="#E2DACA" stroke-width="1"/>
  <circle cx="1405" cy="226" r="5" fill="#46525C"/>
  <text x="1449" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#35414B">Count</text>
  <!-- three allowed X chips -->
  <rect x="1228" y="368" width="80" height="54" rx="14" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="1.8"/>
  <text x="1268" y="403" text-anchor="middle" font-size="22" font-weight="600" fill="#46603C">X</text>
  <rect x="1328" y="368" width="80" height="54" rx="14" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="1.8"/>
  <text x="1368" y="403" text-anchor="middle" font-size="22" font-weight="600" fill="#46603C">X</text>
  <rect x="1428" y="368" width="80" height="54" rx="14" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="1.8"/>
  <text x="1468" y="403" text-anchor="middle" font-size="22" font-weight="600" fill="#46603C">X</text>
  <!-- max line -->
  <line x1="1540" y1="342" x2="1540" y2="448" stroke="#46525C" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>
  <text x="1540" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#77694F">max Y</text>
  <!-- one-too-many chip, faded and struck -->
  <rect x="1572" y="368" width="80" height="54" rx="14" fill="#F2EFE7" stroke="#D8D2C4" stroke-width="1.8"/>
  <text x="1612" y="403" text-anchor="middle" font-size="22" font-weight="600" fill="#B7AF9E">X</text>
  <line x1="1580" y1="372" x2="1644" y2="418" stroke="#B65C48" stroke-width="4" stroke-linecap="round"/>
  <!-- caption -->
  <text x="1440" y="558" text-anchor="middle" font-size="16" font-style="italic" fill="#7A848C">The agent does X at most Y times</text>
</svg>
