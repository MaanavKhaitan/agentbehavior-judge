<svg viewBox="0 0 1760 820" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, 'Avenir Next', 'Nunito Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- behavior-judge palette: cream #F7F4EC · slate #35414B · sage #7E9C6F · taupe #CBC1AD · ink #24292D -->
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,0.8 L9.2,5 L0.5,9.2 Z" fill="#46525C"/>
    </marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#3A4650" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1760" height="820" fill="#F7F4EC"/>

  <!-- Behavior spec -->
  <rect x="70" y="140" width="240" height="160" rx="20" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="190" y="227" text-anchor="middle" font-size="22" font-weight="600" fill="#35414B">Behavior spec</text>

  <!-- Agent trajectories -->
  <rect x="70" y="440" width="240" height="160" rx="20" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="190" y="512" text-anchor="middle" font-size="22" font-weight="600" fill="#35414B">Agent trajectories</text>
  <rect x="130" y="534" width="120" height="6" rx="3" fill="#CBC1AD"/>
  <rect x="118" y="554" width="145" height="6" rx="3" fill="#CBC1AD"/>

  <!-- LLM (diamond) -->
  <rect x="420" y="310" width="120" height="120" rx="16" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="2" transform="rotate(45 480 370)" filter="url(#soft2)"/>
  <text x="480" y="377" text-anchor="middle" font-size="21" font-weight="600" fill="#46603C">LLM</text>

  <!-- Judge YAML intermediate representation -->
  <rect x="660" y="280" width="270" height="180" rx="20" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="795" y="350" text-anchor="middle" font-size="21" font-weight="600" fill="#35414B">Judge YAML</text>
  <text x="795" y="380" text-anchor="middle" font-size="21" font-weight="600" fill="#35414B">intermediate</text>
  <text x="795" y="410" text-anchor="middle" font-size="21" font-weight="600" fill="#35414B">representation</text>

  <!-- Trajectories to judge -->
  <rect x="1090" y="80" width="280" height="100" rx="18" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="1230" y="137" text-anchor="middle" font-size="21" font-weight="600" fill="#35414B">Trajectories to judge</text>

  <!-- Judge program -->
  <rect x="1090" y="290" width="280" height="160" rx="20" fill="#24292D" filter="url(#soft2)"/>
  <text x="1230" y="377" text-anchor="middle" font-size="22" font-weight="600" fill="#F6F3EA">Judge program</text>

  <!-- LLM for semantic checks (diamond) -->
  <rect x="1165" y="575" width="130" height="130" rx="16" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="2" transform="rotate(45 1230 640)" filter="url(#soft2)"/>
  <text x="1230" y="622" text-anchor="middle" font-size="18" font-weight="600" fill="#46603C">LLM for</text>
  <text x="1230" y="646" text-anchor="middle" font-size="18" font-weight="600" fill="#46603C">semantic</text>
  <text x="1230" y="670" text-anchor="middle" font-size="18" font-weight="600" fill="#46603C">checks</text>

  <!-- Verdict -->
  <circle cx="1600" cy="370" r="60" fill="#7E9C6F" filter="url(#soft2)"/>
  <text x="1600" y="378" text-anchor="middle" font-size="21" font-weight="600" fill="#FCFBF6">Verdict</text>

  <!-- Connectors -->
  <line x1="322" y1="235" x2="424" y2="322" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="322" y1="505" x2="424" y2="418" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="578" y1="370" x2="648" y2="370" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="942" y1="370" x2="1078" y2="370" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="1230" y1="192" x2="1230" y2="278" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="1382" y1="370" x2="1528" y2="370" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <!-- loop between judge program and semantic-check LLM -->
  <line x1="1180" y1="462" x2="1180" y2="578" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <line x1="1280" y1="578" x2="1280" y2="462" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow2)"/>
</svg>
