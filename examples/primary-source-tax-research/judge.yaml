version: 1
behavior: primary-source-tax-research
metaBehaviors:
  - name: Read the tax research skill before beginning source research
    trigger:
      description: The agent begins source research.
      match:
        - action: web_search
        - action: open_url
    checks:
      - type: ordering
        quote: the agent first reads the tax research skill, before searching or opening a source
        first:
          action: read_skill
        before:
          - action: web_search
          - action: open_url
    semanticChecks: []
    source: >-
      When beginning source research to answer a tax question, the agent first reads the tax
      research skill, before searching or opening a source. Reading the skill after the first search
      or source open does not satisfy this behavior.


      Each tax research process is one occurrence.


      **Why:** The skill is the versioned source of the current research method. Reading it before
      research is the observable control that ensures the source search follows that method.
  - name: Consult primary sources before answering
    trigger:
      description: The agent answers a tax question.
      semantic: true
    checks:
      - type: ordering
        quote: Before deciding on the answer, it reads the relevant primary source
        first:
          action: open_url_result
          metadata:
            sourceType: primary
        before:
          action: final_answer
    semanticChecks:
      - quote: bases its conclusion on that source
        question: Does the final answer base its conclusion on the primary source the agent read?
    source: >-
      When answering a tax question, the agent may use web search and secondary sources to find the
      relevant rule. Before deciding on the answer, it reads the relevant primary source and bases
      its conclusion on that source. It does not rely on secondary sources or pre-training alone,
      even when they would produce the correct answer.


      Each tax conclusion is one occurrence.


      **Why:** The users of this workflow are accountants who expect to be able to tie each tax
      conclusion back to the primary source that supports it.
